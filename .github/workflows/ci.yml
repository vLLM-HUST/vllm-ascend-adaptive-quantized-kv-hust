name: Plugin CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check . && python -m ruff format --check .
      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: python -m build
      - name: Validate inert Bundle distributions
        if: matrix.python-version == '3.12'
        run: python scripts/validate_distribution.py --dist dist --output distribution-receipt.json
      - name: Upload validated distributions
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-quantized-kv-distributions
          path: |
            dist/*
            distribution-receipt.json
          if-no-files-found: error
          retention-days: 14
